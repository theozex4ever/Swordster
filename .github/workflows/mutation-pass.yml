name: Mutation pass (reusable)

# One sharded pass of tools/godot/mutation-check.sh over the WHOLE mutation list, called by
#   mutation-gate.yml  mode=fast     every pull request (the shards are skipped for a documentation-only one, see `skip`), and every push to main
#   mutation.yml       mode=classic  the weekly strict pass and manual dispatch
# The shard count is an input and the matrix is generated from it, so the matrix, the checker
# (SHARDS) and the summary (SHARDS) can never disagree. It publishes nothing and holds no secrets.
on:
  workflow_call:
    inputs:
      mode:
        description: "fast (the PR gate: stop at the first failing check) or classic (every mutation runs the complete suite)"
        required: true
        type: string
      shards:
        description: "Number of parallel shards the list is split over"
        required: true
        type: number
      timeout-minutes:
        description: "Job time limit of one shard"
        required: true
        type: number
      skip:
        description: "True for a documentation-only pull request: no shard runs, and `all shards` still reports (a success that says so), so a required check never stays pending"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      shards: ${{ steps.matrix.outputs.shards }}
    steps:
      - id: matrix
        shell: bash
        env:
          SHARDS: ${{ inputs.shards }}
          MODE: ${{ inputs.mode }}
        run: |
          [[ "$MODE" == fast || "$MODE" == classic ]] || { echo "::error::mode must be fast or classic (got '$MODE')"; exit 1; }
          [[ "$SHARDS" =~ ^[1-9][0-9]*$ ]] || { echo "::error::shards must be a positive integer (got '$SHARDS')"; exit 1; }
          echo "shards=$(seq 0 $((SHARDS - 1)) | paste -sd, - | sed 's/^/[/; s/$/]/')" >> "$GITHUB_OUTPUT"

  mutation:
    name: shard ${{ matrix.shard }}
    needs: plan
    if: ${{ !inputs.skip }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      # Every shard reports its own counts even when another one fails.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@v7 # v7.0.1; the major tag is the pin
        with:
          persist-credentials: false

      # Same cache as build.yml: only the downloaded archives, keyed on the lock file.
      # build-godot.sh re-checks each one against the SHA-512 values in
      # tools/godot/godot.lock on every run and re-extracts the toolchain from them, so a
      # stale or tampered entry fails with exit 12 instead of being trusted.
      - name: Restore Godot download cache
        uses: actions/cache@v6 # v6.1.0
        with:
          path: ~/.cache/swordster/downloads
          key: godot-downloads-${{ hashFiles('tools/godot/godot.lock') }}

      - name: Install the pinned, checksum-verified Godot
        run: ./build-godot.sh --bootstrap-only

      - name: Run this shard's mutations (${{ inputs.mode }} mode)
        id: run
        shell: bash
        env:
          # fast: the focused / quick / full steps. classic: the complete suite, probes included,
          # for every mutation.
          FAST: ${{ inputs.mode == 'fast' && '1' || '0' }}
          SHARDS: ${{ inputs.shards }}
        run: |
          # A complete pass takes no selection: ONLY / SECTIONS / CORE must be unset (the summary
          # rejects any shard whose RESULT line records a filter, and any count short of the whole list).
          unset ONLY SECTIONS CORE
          set +e
          SHARD="${{ matrix.shard }}" tools/godot/mutation-check.sh 2>&1 | tee "shard-${{ matrix.shard }}.log"
          rc=${PIPESTATUS[0]}
          set -e
          # RESULT shard=… shards=… total=… selected=… filters=… mode=… ran=… caught=… warned=… …; absent if
          # the script died early. The shard's exit status is recorded next to it and is
          # validated by the summary job (an absent or non-zero exit fails the pass).
          result="$(grep '^RESULT ' "shard-${{ matrix.shard }}.log" | tail -n 1 || true)"
          [[ -n "$result" ]] || result="RESULT shard=${{ matrix.shard }} (no result: the script stopped early)"
          echo "$result exit=$rc" > "result-${{ matrix.shard }}.txt"
          {
            echo "### Shard ${{ matrix.shard }} of $SHARDS"
            echo
            echo "\`${result#RESULT }\` (exit $rc)"
            grep -E '^(SURVIVED|INCONCLUSIVE|MUTATION NOT APPLIED|caught-with-warning) ' "shard-${{ matrix.shard }}.log" | sed 's/^/- /' || true
          } >> "$GITHUB_STEP_SUMMARY"
          if ((rc != 0)); then
            echo "::error title=Mutation checks failed (shard ${{ matrix.shard }})::a mutation survived or was inconclusive, or the checker failed: exit code $rc"
            exit "$rc"
          fi

      - name: Upload the shard log and result
        if: always()
        uses: actions/upload-artifact@v7 # v7.0.2
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: |
            shard-${{ matrix.shard }}.log
            result-${{ matrix.shard }}.txt
          if-no-files-found: ignore
          retention-days: 14

  summary:
    name: all shards
    needs: [plan, mutation]
    # Runs even when a shard failed, was cancelled or timed out, so the pass is still
    # reported, but it succeeds only if the matrix job as a whole succeeded AND every shard's
    # result file is present, well formed and clean (see tools/godot/mutation-summary.sh).
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Documentation-only change, nothing to gate
        if: ${{ inputs.skip }}
        run: |
          echo "Every changed file is documentation (see tools/godot/mutation-gate-paths.sh), so the mutation shards were skipped and this check passes." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check out the summary script
        if: ${{ !inputs.skip }}
        uses: actions/checkout@v7 # v7.0.1; the major tag is the pin
        with:
          persist-credentials: false

      - name: Collect every shard's result and log
        if: ${{ !inputs.skip }}
        uses: actions/download-artifact@v8 # v8.0.2
        # Nothing to download when no shard got far enough to upload (the next step reports it).
        continue-on-error: true
        with:
          pattern: mutation-shard-*
          path: results
          merge-multiple: true

      - name: Judge the pass
        if: ${{ !inputs.skip }}
        shell: bash
        env:
          MATRIX_RESULT: ${{ needs.mutation.result }}
          SHARDS: ${{ inputs.shards }}
          # The mode every shard must have run in (the RESULT lines are checked against it).
          MODE: ${{ inputs.mode }}
        run: bash tools/godot/mutation-summary.sh results
