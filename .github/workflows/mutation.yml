name: Mutation checks (classic, weekly)

# The STRICT mutation pass: the classic mode (FAST=0) runs the complete suite, probes included,
# for every mutation, so it also finds checks that crash or hang once they run on a broken project.
# It takes about an hour of wall time, so it is not a gate: the pull-request gate is mutation-gate.yml (the
# fast mode). This one runs every Monday and on manual dispatch (Actions -> Mutation checks
# (classic, weekly) -> Run workflow, on any branch). A mutation that has a genuine FAIL line and
# then crashes, errors or times out is caught-with-warning: a hygiene warning listed in the summary,
# not a failure. A mutation with no FAIL line and a crash, hang or script error is inconclusive and
# fails the pass, as does a survivor. It publishes nothing and holds no secrets.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-classic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation:
    name: mutation
    uses: ./.github/workflows/mutation-pass.yml
    with:
      mode: classic
      # Classic mode costs about a minute per mutation on a runner (~1,100 mutations, ~900 runner
      # minutes): 24 shards of ~45 mutations take roughly 50 minutes, so a 120 minute limit is more
      # than twice what a shard needs.
      shards: 24
      timeout-minutes: 120
