name: Mutation checks

# The exhaustive mutation pass (tools/godot/mutation-check.sh): every deliberate bug
# must be rejected by the headless checks. It is too long for every pull request, so
# per-PR work runs only the touched sections locally (see "Mutation checks" in
# godot/README.md) and this workflow runs the FULL pass after merge: on every push to
# main and on manual dispatch (Actions -> Mutation checks -> Run workflow, on any
# branch). It publishes nothing and holds no secrets.
on:
  push:
    branches: [main, tooling/35-fast-mutations] # TEMPORARY: branch trigger to validate before merge
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One full pass per ref at a time. A newer push to main replaces a run that has not
  # started yet and never cancels one in progress; the newer run covers the older commit.
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep in step with the matrix below: SHARDS is its length.
  SHARDS: 8

jobs:
  mutation:
    name: shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      # Every shard reports its own counts even when another one fails.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@v7 # v7.0.1; the major tag is the pin
        with:
          persist-credentials: false

      # Same cache as build.yml: only the downloaded archives, keyed on the lock file.
      # build-godot.sh re-checks each one against the SHA-512 values in
      # tools/godot/godot.lock on every run and re-extracts the toolchain from them, so a
      # stale or tampered entry fails with exit 12 instead of being trusted.
      - name: Restore Godot download cache
        uses: actions/cache@v6 # v6.1.0
        with:
          path: ~/.cache/swordster/downloads
          key: godot-downloads-${{ hashFiles('tools/godot/godot.lock') }}

      - name: Install the pinned, checksum-verified Godot
        run: ./build-godot.sh --bootstrap-only

      - name: Run this shard's mutations
        id: run
        shell: bash
        run: |
          set +e
          SHARD="${{ matrix.shard }}" SHARDS="$SHARDS" tools/godot/mutation-check.sh 2>&1 | tee "shard-${{ matrix.shard }}.log"
          rc=${PIPESTATUS[0]}
          set -e
          # RESULT shard=… ran=… caught=… survived=… inconclusive=…; absent if the script died early.
          result="$(grep '^RESULT ' "shard-${{ matrix.shard }}.log" | tail -n 1 || true)"
          [[ -n "$result" ]] || result="RESULT shard=${{ matrix.shard }} ran=0 caught=0 survived=0 inconclusive=0 (no result: the script stopped early)"
          echo "$result" > "result-${{ matrix.shard }}.txt"
          {
            echo "### Shard ${{ matrix.shard }} of $SHARDS"
            echo
            echo "\`${result#RESULT }\` (exit $rc)"
            grep -E '^(SURVIVED|INCONCLUSIVE) ' "shard-${{ matrix.shard }}.log" | sed 's/^/- /' || true
          } >> "$GITHUB_STEP_SUMMARY"
          if ((rc != 0)); then
            echo "::error title=Mutation checks failed (shard ${{ matrix.shard }})::a mutation survived or was inconclusive, or the checker failed: exit code $rc"
            exit "$rc"
          fi

      - name: Upload the shard log and result
        if: always()
        uses: actions/upload-artifact@v7 # v7.0.2
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: |
            shard-${{ matrix.shard }}.log
            result-${{ matrix.shard }}.txt
          if-no-files-found: ignore
          retention-days: 14

  summary:
    name: all shards
    needs: mutation
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Collect every shard's result
        uses: actions/download-artifact@v8 # v8.0.2
        with:
          pattern: mutation-shard-*
          path: results
          merge-multiple: true

      - name: Count caught, survived and inconclusive per shard
        shell: bash
        run: |
          shopt -s nullglob
          files=(results/result-*.txt)
          {
            echo "### Mutation checks, full pass"
            echo
            echo "| Shard | Ran | Caught | Survived | Inconclusive |"
            echo "| ---: | ---: | ---: | ---: | ---: |"
          } >> "$GITHUB_STEP_SUMMARY"
          ran=0 caught=0 survived=0 inconclusive=0 seen=0
          for ((s = 0; s < SHARDS; s++)); do
            file="results/result-$s.txt"
            if [[ ! -f "$file" ]]; then
              echo "| $s | missing | | | |" >> "$GITHUB_STEP_SUMMARY"; continue
            fi
            seen=$((seen + 1))
            read -r -a fields < "$file"
            declare -A kv=()
            for field in "${fields[@]}"; do [[ "$field" == *=* ]] && kv[${field%%=*}]="${field#*=}"; done
            echo "| $s | ${kv[ran]:-0} | ${kv[caught]:-0} | ${kv[survived]:-0} | ${kv[inconclusive]:-0} |" >> "$GITHUB_STEP_SUMMARY"
            ran=$((ran + ${kv[ran]:-0})); caught=$((caught + ${kv[caught]:-0}))
            survived=$((survived + ${kv[survived]:-0})); inconclusive=$((inconclusive + ${kv[inconclusive]:-0}))
            unset kv
          done
          echo "| **all** | **$ran** | **$caught** | **$survived** | **$inconclusive** |" >> "$GITHUB_STEP_SUMMARY"
          if ((seen != SHARDS || survived != 0 || inconclusive != 0 || ran == 0 || caught != ran)); then
            echo "::error title=Mutation checks failed::$survived survived, $inconclusive inconclusive, $caught of $ran caught, results from $seen of $SHARDS shards"
            exit 1
          fi
