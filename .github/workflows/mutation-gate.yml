name: Mutation gate

# The mutation checks (tools/godot/mutation-check.sh) as a gate: every deliberate bug must be
# rejected by a genuine failing check. The FULL list runs in FAST mode (the checker's focused /
# quick / full steps, so a mutation costs a second or two and the whole pass a few minutes of
# wall time over the shards) on
#   - every pull request that touches godot/, tools/godot/, tools/reference/ or a mutation workflow, and
#   - every push to main (no path filter: main always has a verdict for its head).
# It is blocking: the "all shards" job fails unless every shard ran, the shards together covered
# the whole list, and every mutation was caught (see tools/godot/mutation-summary.sh). A mutation
# that is caught-with-warning (a genuine FAIL line and then a crash or timeout) is listed but
# never fails it. The strict classic pass (every mutation runs the complete suite) is the weekly
# run in mutation.yml. See "Mutation checks" in godot/README.md.
on:
  pull_request:
    paths:
      - "godot/**"
      - "tools/godot/**"
      - "tools/reference/**"
      - ".github/workflows/mutation*.yml"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels that PR's superseded run (its result would be for a
  # commit nobody will merge). Pushes to main are never cancelled: each head keeps its verdict.
  group: mutation-gate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mutation:
    name: mutation
    uses: ./.github/workflows/mutation-pass.yml
    with:
      mode: fast
      # About 1,070 mutations at 1-2 seconds each: a shard of 66 mutations (16 shards) took 2.5 minutes after
      # a minute of setup, but the runner pool ran only about ten jobs at once, so 16 shards queued into two
      # waves (14 minutes in all). Eight shards (about 134 mutations, ~5 minutes) all start together. The
      # repository is public, so the runner minutes are free.
      shards: 8
      timeout-minutes: 40
